[project]
name = "server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "trap37", email = "patrickthethree@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "common",
    "flask>=3.1.3",
    "flask-migrate>=4.1.0",
    "flask-sqlalchemy>=3.1.1",
    "flask-wtf>=1.3.0",
    "openpyxl>=3.1.5",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "tzdata>=2026.5",
    "wtforms>=3.3.1",
]

[project.scripts]
server = "server:main"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
common = { workspace = true, editable = true }

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
